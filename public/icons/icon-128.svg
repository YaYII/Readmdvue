<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#5856D6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#AF52DE;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF2D92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9500;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </radialGradient>
    <filter id="glow128" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <filter id="innerShadow128" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#gradient128)" filter="url(#glow128)"/>
  
  <!-- 内阴影和边框 -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" filter="url(#innerShadow128)"/>
  
  <!-- 高光层 -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#radialGlow)"/>
  
  <!-- Markdown 符号 M -->
  <path d="M32 40h16l12 20L72 40h16v48h-12V64L64 80l-12-16v24H40V40z" 
        fill="white" 
        fill-opacity="0.95" 
        stroke="rgba(0,0,0,0.1)" 
        stroke-width="1" 
        filter="url(#textShadow)"/>
  
  <!-- 装饰元素 - 代表代码块 -->
  <rect x="96" y="32" width="8" height="2" rx="1" fill="rgba(255,255,255,0.8)"/>
  <rect x="96" y="36" width="12" height="2" rx="1" fill="rgba(255,255,255,0.7)"/>
  <rect x="96" y="40" width="6" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
  
  <!-- 装饰圆点 -->
  <circle cx="96" cy="96" r="4" fill="rgba(255,255,255,0.8)"/>
  <circle cx="32" cy="96" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="96" cy="24" r="2" fill="rgba(255,255,255,0.5)"/>
  
  <!-- 链接符号装饰 -->
  <path d="M24 24h8v2h-8v-2zm0 4h6v2h-6v-2z" fill="rgba(255,255,255,0.4)"/>
  
  <!-- 主高光效果 -->
  <ellipse cx="48" cy="32" rx="24" ry="8" fill="rgba(255,255,255,0.4)" transform="rotate(-15 48 32)"/>
  
  <!-- 次要高光 -->
  <ellipse cx="80" cy="80" rx="12" ry="4" fill="rgba(255,255,255,0.2)" transform="rotate(15 80 80)"/>
</svg>