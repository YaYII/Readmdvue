<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AF52DE;stop-opacity:1" />
    </linearGradient>
    <filter id="glow16" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="1" y="1" width="14" height="14" rx="3" ry="3" fill="url(#gradient16)" filter="url(#glow16)"/>
  
  <!-- Markdown 符号 M -->
  <path d="M3 4.5h2l1.5 2.5L8 4.5h2v7H9V7.5L7.5 9.5 6 7.5v4H4.5V4.5z" fill="white" fill-opacity="0.95"/>
  
